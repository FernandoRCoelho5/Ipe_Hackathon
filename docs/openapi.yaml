            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ipe_session
      description: Sessão do perfil de acesso (Administrador Municipal, Técnico/Analista, Cliente Corporativo ou Leitor Público).
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - payload_too_large
                - unsupported_media_type
                - rate_limited
                - internal
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
                required:
                  - path
                  - message
                additionalProperties: false
            requestId:
              type: string
          required:
            - code
            - message
            - requestId
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        pageSize:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        totalPages:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - page
        - pageSize
        - total
        - totalPages
      additionalProperties: false
    DataNotice:
      type: object
      properties:
        demo:
          type: boolean
        seal:
          type: string
      required:
        - demo
        - seal
      additionalProperties: false
    Recommendation:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - arborizacao
            - pavimento-permeavel
            - telhado-frio
        variant:
          type: string
          enum:
            - copa-elevada
            - copa-ampla
            - porte-compacto
            - sombreamento-tatico
            - jardim-de-chuva
            - pavimento-drenante
            - pintura-atermica
        level:
          type: string
          enum:
            - tatico
            - estruturante
        title:
          type: string
        actions:
          type: array
          items:
            type: string
        rationale:
          type: array
          items:
            type: string
        potentialSites:
          type: array
          items:
            type: string
            enum:
              - canteiros
              - pracas
              - recuos
              - calcadas-largas
              - faixa-de-servico
              - vagas-de-estacionamento
              - estacionamentos
              - telhados
        suggestedSpecies:
          type: array
          items:
            type: string
            enum:
              - ipe-amarelo
              - ipe-roxo
              - sibipiruna
              - pau-ferro
              - oiti
              - quaresmeira
              - aroeira-pimenteira
        priority:
          type: number
          minimum: 0
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        checklist:
          type: array
          items:
            type: string
            enum:
              - fiacao-aerea
              - largura-calcada
              - recuos
              - redes-subterraneas
              - acessos-visibilidade
              - drenagem-existente
              - infiltracao-solo
              - estrutura-telhado
              - responsavel-tecnico
      required:
        - id
        - type
        - variant
        - level
        - title
        - actions
        - rationale
        - potentialSites
        - suggestedSpecies
        - priority
        - confidence
        - checklist
      additionalProperties: false
    IvtuResult:
      type: object
      properties:
        score:
