# Gerado por `npm run openapi` a partir de src/lib/api/contracts.ts — não edite à mão.
openapi: 3.1.0
info:
  title: Ipê · Inteligência Térmica Urbana — API
  version: 1.0.0
  description: |-
    API de suporte à decisão para ilhas de calor e infraestrutura verde.

    **Todas as recomendações são pré-diagnóstico automatizado para subsidiar a análise do profissional responsável.**
    Nesta versão, os dados são demonstrativos (ver docs/DATA.md).

    Erros seguem o formato `ApiError`. Respostas trazem o cabeçalho `X-Request-Id`.
    Leituras são públicas. Escritas protegidas exigem a sessão de um perfil com a permissão indicada (RF08); no MVP, um cookie assinado de demonstração, e no piloto, OIDC.
    Este contrato é gerado a partir dos schemas Zod em `src/lib/api/contracts.ts` (`npm run openapi`).
  license:
    name: Proprietário
servers:
  - url: /api/v1
    description: Next.js (MVP) — o backend FastAPI implementará o mesmo contrato
tags:
  - name: Territórios
  - name: Diagnóstico térmico
  - name: Prescrição
  - name: Simulação
  - name: Ciência cidadã
  - name: Sensores IoT
  - name: Adote uma Ilha Verde
  - name: Relatórios
  - name: Comercial
paths:
  /municipalities:
    get:
      tags:
        - Territórios
      summary: Municípios atendidos
      description: Centro, bounding box e zoom de cada município. A plataforma escala trocando apenas estes dados.
      operationId: getMunicipalities
      responses:
        "200":
          description: Lista de municípios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MunicipalityListResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /alerts:
    get:
      tags:
        - Territórios
      summary: Alertas de calor ativos
      operationId: getAlerts
      parameters:
        - name: municipality
          in: query
          required: true
          description: "Identificador do município (ex.: `volta-redonda`)."
          schema:
            type: string
            pattern: ^[a-z0-9-]+$
      responses:
        "200":
          description: Alertas vigentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
        "400":
          description: Parâmetros ou corpo inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /thermals/map-layers:
    get:
      tags:
        - Diagnóstico térmico
      summary: Camadas térmicas do mapa (GeoJSON)
      description: Quarteirões com LST de satélite, UTCI na hora pedida, UTCI de pico, IVTU e ação recomendada. Toda resposta traz o selo de pré-diagnóstico.
      operationId: getThermalsMapLayers
      parameters:
        - name: municipality
          in: query
          required: true
          description: "Identificador do município (ex.: `volta-redonda`)."
          schema:
            type: string
            pattern: ^[a-z0-9-]+$
        - name: hour
          in: query
          required: false
          description: Hora local de 8 a 18 para a sensação térmica.
          schema:
            default: 14
            type: integer
            minimum: 8
            maximum: 18
      responses:
        "200":
          description: FeatureCollection de quarteirões
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapLayersResponse"
        "400":
          description: Parâmetros ou corpo inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /thermals/utci-by-hour:
    get:
      tags:
        - Diagnóstico térmico
      summary: UTCI de 08h a 18h de todos os quarteirões
      description: "Payload compacto para o slider de horário: o cliente recolore o mapa sem baixar a geometria de novo."
      operationId: getThermalsUtciByHour
      parameters:
        - name: municipality
          in: query
          required: true
          description: "Identificador do município (ex.: `volta-redonda`)."
          schema:
            type: string
            pattern: ^[a-z0-9-]+$
      responses:
        "200":
          description: UTCI por quarteirão e hora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UtciByHourResponse"
        "400":
          description: Parâmetros ou corpo inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /blocks/{id}:
    get:
      tags:
        - Diagnóstico térmico
      summary: Diagnóstico de um quarteirão
      description: UTCI, IVTU, drenagem, prescrição com justificativa e curva horária 08h–18h.
      operationId: getBlocksId
      parameters:
        - name: id
          in: path
          required: true
          description: "Identificador do quarteirão (ex.: vr-0001)"
          schema:
            type: string
      responses:
        "200":
          description: Diagnóstico completo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockDetailResponse"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /blocks/{id}/checklist:
    get:
      tags:
        - Prescrição
      summary: Checklist de validação de campo
      operationId: getBlocksIdChecklist
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do quarteirão
          schema:
            type: string
      responses:
        "200":
          description: Checklist e progresso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistResponse"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
        - Prescrição
      summary: Salvar checklist de validação de campo
      description: "**Permissão:** registrar checklist de validação em campo."
      security:
        - sessionCookie: []
      operationId: putBlocksIdChecklist
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do quarteirão
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: object
                  propertyNames:
                    type: string
                    enum:
                      - fiacao-aerea
                      - largura-calcada
                      - recuos
                      - redes-subterraneas
                      - acessos-visibilidade
                      - drenagem-existente
                      - infiltracao-solo
                      - estrutura-telhado
                      - responsavel-tecnico
                  additionalProperties:
                    type: string
                    enum:
                      - pendente
                      - conforme
                      - nao-conforme
                      - nao-se-aplica
                notes:
                  default: ""
                  type: string
                  maxLength: 2000
              required:
                - items
      responses:
        "200":
          description: Checklist salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistResponse"
        "400":
          description: Parâmetros ou corpo inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sessão ausente ou expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: O perfil da sessão não tem a permissão exigida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Corpo acima de 64 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Corpo deve ser application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Limite de requisições excedido por IP e rota (escritas: 30/min; cálculos what-if e ESG: 240/min; pedidos de piloto: 5/min)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /prescriptions/ivtu-ranking:
    get:
      tags:
        - Prescrição
      summary: Ranking IVTU com ação recomendada
      description: "`rank` é sempre a posição pelo IVTU no município, qualquer que seja a ordenação escolhida."
      operationId: getPrescriptionsIvtuRanking
      parameters:
        - name: municipality
          in: query
          required: true
          description: "Identificador do município (ex.: `volta-redonda`)."
          schema:
            type: string
            pattern: ^[a-z0-9-]+$
        - name: neighborhood
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: zones
          in: query
          required: false
          description: "Zonas separadas por vírgula: comercial, residencial, misto, industrial, verde."
          schema:
            type: string
        - name: ivtuLevels
          in: query
          required: false
          description: "Níveis IVTU separados por vírgula: baixo, medio, alto, critico."
          schema:
            type: string
        - name: executionLevel
          in: query
          required: false
          schema:
            type: string
            enum:
              - tatico
              - estruturante
        - name: intervention
          in: query
          required: false
          schema:
            type: string
            enum:
              - arborizacao
              - pavimento-permeavel
              - telhado-frio
        - name: search
          in: query
          required: false
          description: Busca por código, logradouro ou bairro.
          schema:
            type: string
            maxLength: 80
        - name: sort
          in: query
          required: false
          schema:
            default: ivtu
            type: string
            enum:
              - ivtu
              - utci
              - priority
              - code
        - name: order
          in: query
          required: false
          schema:
            default: desc
            type: string
            enum:
              - asc
              - desc
        - name: page
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: pageSize
          in: query
          required: false
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Página do ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingResponse"
        "400":
          description: Parâmetros ou corpo inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /simulation/what-if:
    post:
      tags:
        - Simulação
      summary: Simular intervenções num quarteirão
      description: Árvores (espécie e quantidade), pavimento permeável e pintura atérmica. O alívio é devolvido como faixa (conservador, central e otimista).
      operationId: postSimulationWhatIf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                blockId:
                  type: string
                  minLength: 1
                trees:
                  default: []
                  maxItems: 10
                  type: array
                  items:
                    type: object
                    properties:
                      speciesId:
                        type: string
                        enum:
                          - ipe-amarelo
                          - ipe-roxo
                          - sibipiruna
                          - pau-ferro
                          - oiti
                          - quaresmeira
                          - aroeira-pimenteira
                      count:
                        type: integer
                        minimum: 0
                        maximum: 300
                    required:
                      - speciesId
                      - count
                permeablePavementShare:
                  default: 0
                  type: number
                  minimum: 0
                  maximum: 1
                coolRoofShare:
                  default: 0
                  type: number
                  minimum: 0
                  maximum: 1
                horizonYears:
                  default: 10
                  type: integer
                  minimum: 1
                  maximum: 20
              required:
                - blockId
      responses:
        "200":
          description: Resultado da simulação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatIfResponse"
        "400":
          description: Parâmetros ou corpo inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Corpo acima de 64 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Corpo deve ser application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Limite de requisições excedido por IP e rota (escritas: 30/min; cálculos what-if e ESG: 240/min; pedidos de piloto: 5/min)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /simulation/scenarios:
    get:
      tags:
        - Simulação
      summary: Cenários de projeto salvos
      operationId: getSimulationScenarios
      parameters:
        - name: municipality
          in: query
          required: false
          description: "Identificador do município (ex.: `volta-redonda`)."
          schema:
            type: string
      responses:
        "200":
          description: Cenários salvos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedScenarioListResponse"
    post:
      tags:
        - Simulação
      summary: Salvar cenário de projeto
      description: "**Permissão:** salvar cenários do simulador."
      security:
        - sessionCookie: []
      operationId: postSimulationScenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 80
                municipalityId:
                  type: string
                  minLength: 1
                scenario:
                  type: object
                  properties:
                    blockId:
                      type: string
                      minLength: 1
                    trees:
                      default: []
                      maxItems: 10
                      type: array
                      items:
                        type: object
                        properties:
                          speciesId:
                            type: string
                            enum:
                              - ipe-amarelo
                              - ipe-roxo
                              - sibipiruna
                              - pau-ferro
                              - oiti
                              - quaresmeira
                              - aroeira-pimenteira
                          count:
                            type: integer
                            minimum: 0
                            maximum: 300
                        required:
                          - speciesId
                          - count
                    permeablePavementShare:
                      default: 0
                      type: number
                      minimum: 0
                      maximum: 1
                    coolRoofShare:
                      default: 0
                      type: number
                      minimum: 0
                      maximum: 1
                    horizonYears:
                      default: 10
                      type: integer
                      minimum: 1
                      maximum: 20
                  required:
                    - blockId
              required:
                - name
                - municipalityId
                - scenario
      responses:
        "201":
          description: Cenário salvo com resumo congelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    minLength: 3
                    maxLength: 80
                  municipalityId:
                    type: string
                    minLength: 1
                  scenario:
                    type: object
                    properties:
                      blockId:
                        type: string
                        minLength: 1
                      trees:
                        default: []
                        maxItems: 10
                        type: array
                        items:
                          type: object
                          properties:
                            speciesId:
                              type: string
                              enum:
                                - ipe-amarelo
                                - ipe-roxo
                                - sibipiruna
                                - pau-ferro
                                - oiti
                                - quaresmeira
                                - aroeira-pimenteira
                            count:
                              type: integer
                              minimum: 0
                              maximum: 300
                          required:
                            - speciesId
                            - count
                          additionalProperties: false
                      permeablePavementShare:
                        default: 0
                        type: number
                        minimum: 0
                        maximum: 1
                      coolRoofShare:
                        default: 0
                        type: number
                        minimum: 0
                        maximum: 1
                      horizonYears:
                        default: 10
                        type: integer
                        minimum: 1
                        maximum: 20
                    required:
                      - blockId
                      - trees
                      - permeablePavementShare
                      - coolRoofShare
                      - horizonYears
                    additionalProperties: false
                  id:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                  summary:
                    type: object
                    properties:
                      blockCode:
                        type: string
                      blockLabel:
                        type: string
                      peakUtciDelta:
                        type: number
                      peakUtciDeltaRange:
                        type: array
                        prefixItems:
                          - type: number
                          - type: number
                        items: false
                        minItems: 2
                        maxItems: 2
                      runoffChange:
                        type: number
                      evapotranspirationChange:
                        type: number
                      plantedTrees:
                        type: number
                      permeableAreaM2:
                        type: number
                      coolRoofAreaM2:
                        type: number
                    required:
                      - blockCode
                      - blockLabel
                      - peakUtciDelta
                      - peakUtciDeltaRange
                      - runoffChange
                      - evapotranspirationChange
                      - plantedTrees
                      - permeableAreaM2
                      - coolRoofAreaM2
                    additionalProperties: false
                required:
                  - name
                  - municipalityId
                  - scenario
                  - id
                  - createdAt
                  - summary
                additionalProperties: false
        "400":
          description: Parâmetros ou corpo inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sessão ausente ou expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: O perfil da sessão não tem a permissão exigida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Corpo acima de 64 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Corpo deve ser application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Limite de requisições excedido por IP e rota (escritas: 30/min; cálculos what-if e ESG: 240/min; pedidos de piloto: 5/min)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /esg/impact:
    post:
      tags:
        - Simulação
      summary: Calcular retorno ESG
      operationId: postEsgImpact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trees:
                  default: []
                  maxItems: 20
                  type: array
                  items:
                    type: object
                    properties:
                      speciesId:
                        type: string
                        enum:
                          - ipe-amarelo
                          - ipe-roxo
                          - sibipiruna
                          - pau-ferro
                          - oiti
                          - quaresmeira
                          - aroeira-pimenteira
                      count:
                        type: integer
                        minimum: 0
                        maximum: 300
                    required:
                      - speciesId
                      - count
                permeableAreaM2:
                  default: 0
                  type: number
                  minimum: 0
                  maximum: 1000000
                coolRoofAreaM2:
                  default: 0
                  type: number
                  minimum: 0
                  maximum: 1000000
                horizonYears:
                  default: 10
                  type: integer
                  minimum: 1
                  maximum: 30
      responses:
        "200":
          description: Impacto com premissas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EsgResult"
        "400":
          description: Parâmetros ou corpo inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Corpo acima de 64 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Corpo deve ser application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Limite de requisições excedido por IP e rota (escritas: 30/min; cálculos what-if e ESG: 240/min; pedidos de piloto: 5/min)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /citizen-reports:
    get:
      tags:
        - Ciência cidadã
      summary: Relatos cidadãos anônimos
      description: "LGPD: apenas texto, coordenadas e categoria. Inclui contagem por status para moderação."
      operationId: getCitizenReports
      parameters:
        - name: municipality
          in: query
          required: false
          description: "Identificador do município (ex.: `volta-redonda`)."
          schema:
            type: string
            pattern: ^[a-z0-9-]+$
        - name: statuses
          in: query
          required: false
          description: "Status separados por vírgula: pendente, validado, descartado, spam."
          schema:
            type: string
        - name: categories
          in: query
          required: false
          description: Categorias de relato separadas por vírgula.
          schema:
            type: string
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        - name: page
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: pageSize
          in: query
          required: false
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Página de relatos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenReportListResponse"
        "400":
          description: Parâmetros ou corpo inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - Ciência cidadã
      summary: Registrar relato
